name: Documentation Governance

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-doc-governance.mjs"
      - ".github/workflows/docs-governance.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "scripts/check-doc-governance.mjs"
      - ".github/workflows/docs-governance.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  docs-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check documentation governance
        env:
          DOCS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: node scripts/check-doc-governance.mjs
